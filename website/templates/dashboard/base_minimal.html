<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prowl - {{ guild.name if guild else 'Dashboard' }}</title>
  <meta name="description" content="prowl is your next discord bot!" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Prowl Dashboard{% if guild %} — {{ guild.name }}{% endif %}" />
  <link rel="icon" href="/static/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://unpkg.com" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --page-bg: #f0f2f5;
      --card-bg: #ffffff;
      --card-border: #e5e7eb;
      --text: #111827;
      --text-dim: #6b7280;
      --input-bg: #ffffff;
      --input-border: #d1d5db;
      --accent: #6366f1;
      --accent-hover: #4f51e3;
    }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
    body { font-family: 'Lexend', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    #app-shell { max-width: 1240px; margin: 0 auto; padding: 1.75rem; background: var(--page-bg); min-height: 100vh; }
    #toast-container { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 0.5rem; z-index: 9999; }
  </style>
    {% block styles %}{% endblock %}
  </head>
<body>
  <div id="loading-bar"></div>
  <div id="app-shell">
    <div id="page-content">
      {% block content %}{% endblock %}
    </div>
  </div>
  <div id="toast-container"></div>
  <script>
    (function(){
      var origFetch = window.fetch.bind(window);
      window.fetch = function(url, opts) {
        if (typeof url === 'string' && url.indexOf('/api/') === 0) {
          opts = opts || {};
          if (!opts.credentials) opts.credentials = 'include';
        }
        return origFetch(url, opts);
      };
    })();
  </script>
  <script>
    function showToast(message, type = 'info', duration = 4000) {
      var container = document.getElementById('toast-container');
      if (!container) return;
      var toast = document.createElement('div');
      toast.className = 'md-toast md-toast-' + type;
      toast.textContent = message;
      toast.style.cssText = 'min-width:200px;max-width:420px;padding:0.75rem 1rem;border-radius:6px;font-size:0.82rem;font-weight:600;color:#fff;background:' + (type==='error'?'#ef4444':type==='success'?'#22c55e':type==='warning'?'#f59e0b':'#3b82f6') + ';box-shadow:0 6px 14px rgba(0,0,0,0.25);opacity:0;transform:translateY(8px);transition:opacity .15s ease .15s,transform .25s ease';
      container.appendChild(toast);
      setTimeout(function(){ toast.style.opacity='1'; toast.style.transform='translateY(0)'; }, 10);
      setTimeout(function(){ toast.style.opacity='0'; toast.style.transform='translateY(8px)'; }, duration);
      setTimeout(function(){ if (toast.parentNode) toast.parentNode.removeChild(toast); }, duration + 350);
    }
    window.showToast = showToast;
    window.__USER = {{ user | tojson }};
  </script>
  {% block scripts %}{% endblock %}
  <script>lucide.createIcons();</script>
</body>
</html>
