{% extends "dashboard/base.html" %}
{% block content %}
<link rel="stylesheet" href="/static/moderation.css?v=21" />
<style>
  .mem-avatar { position: relative; }
  .mem-avatar.recent { outline: 2px solid #60a5fa; outline-offset: -1px; }
  .mem-avatar.raider { outline: 2px solid #f87171; outline-offset: -1px; }
  .mem-name { position: relative; display: inline-flex; align-items: center; padding-right: 18px; }
  .mem-edit { position:absolute; right:2px; top:50%; transform:translateY(-50%); cursor:pointer; color:rgba(255,255,255,0.4); width:13px; height:13px; display:none; }
  .mem-edit:hover { color:#fff; }
  .mem-name:hover .mem-edit { display:block; }
  .role-tag { display:inline-flex; align-items:center; gap:0.25rem; font-size:0.68rem; padding:0.12rem 0.45rem; border-radius:4px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); color:rgba(255,255,255,0.6); white-space:nowrap; }
  .role-tag .role-x { display:none; cursor:pointer; color:rgba(255,255,255,0.35); }
  .role-tag .role-x:hover { color:#f87171; }
  .role-tag:hover .role-x { display:inline; }
  #add-role-list::-webkit-scrollbar { width:4px; }
  #add-role-list::-webkit-scrollbar-track { background:transparent; }
  #add-role-list::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.08); border-radius:999px; }
</style>
<div style="padding:2rem 0;">

  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:0.75rem;">
    <div>
      <h1 style="font-size:26px;font-weight:900;letter-spacing:-0.03em;line-height:1.05;">Users</h1>
      <p style="color:rgba(255,255,255,0.5);font-size:14px;font-weight:600;margin-top:4px;">All server members with quick actions</p>
    </div>
    <input type="text" class="md-input" id="member-search" placeholder="Search members..." style="width:220px;" />
  </div>
    <div class="md-modal">
      <h3>Actions</h3>
      <div class="md-member-info" style="margin:0.25rem 0 0.75rem;"><div class="md-member-avatar" id="modal-user-avatar" style="width:36px;height:36px;"></div><span class="md-member-name" id="modal-user-name"></span></div>
      <input type="text" placeholder="Reason (optional)" id="action-reason" />
      <div class="md-popover-label">Mute duration</div>
      <div class="md-popover-row">
        <button class="md-action-btn" data-dur="10">10m</button>
        <button class="md-action-btn" data-dur="60">1h</button>
        <button class="md-action-btn" data-dur="1440">1d</button>
      </div>
      <div class="md-popover-label">Mod actions</div>
      <div class="md-popover-row">
        <button class="md-action-btn warn" id="modal-kick"><i data-lucide="log-out"></i> Kick</button>
        <button class="md-action-btn danger" id="modal-ban"><i data-lucide="ban"></i> Ban</button>
      </div>
      <button class="md-modal-close">Cancel</button>
    </div>
  </div>

  <!-- Add role menu -->
  <div class="md-modal-overlay" id="add-role-modal">
    <div class="md-modal">
      <h3>Add Role</h3>
      <div class="md-member-name" id="add-role-user" style="margin-bottom:0.75rem;"></div>
      <div style="display:flex;flex-direction:column;gap:0.3rem;max-height:260px;overflow-y:auto;margin-bottom:0.75rem;" id="add-role-list"></div>
      <button class="md-modal-close" id="add-role-cancel">Cancel</button>
    </div>
  </div>

  <!-- Nickname modal -->
  <div class="md-modal-overlay" id="nickname-modal">
    <div class="md-modal">
      <h3>Change Nickname</h3>
      <div class="md-member-name" id="nickname-user" style="margin-bottom:0.75rem;"></div>
      <input type="text" class="md-input" id="nickname-input" placeholder="New nickname" style="margin-bottom:0.75rem;" />
      <div class="md-popover-row" style="margin-top:0.75rem;">
        <button class="md-action-btn" id="nickname-save" style="flex:1;justify-content:center;background:rgba(255,255,255,0.1);color:#e9edf5;">Save</button>
        <button class="md-action-btn" id="nickname-cancel" style="flex:1;justify-content:center;color:rgba(255,255,255,0.4);">Cancel</button>
      </div>
    </div>
  </div>

</div>
<style>
@media (max-width:600px){
  #members-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .md-member-table{min-width:600px}
}
</style>
{% endblock %}
{% block scripts %}
<script>
const GID = window.__GUILD_ID;
const api = (p, o) => fetch(`/api/v1/mod/${GID}${p}`, o||{}).then(r=>r.json());
const memApi = (p, o) => fetch(`/api/v1/members/${GID}${p}`, o||{}).then(r=>r.json());
const esc = s => { const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; };

let MEMBERS = [];
let ROLE_MAP = {};       // id -> name
let ROLE_POS = {};       // id -> position
let ROLE_MANAGED = {};   // id -> bool (bot/integration roles that can't be removed)
let BOT = { bot_top_role_position: 0, can_manage_nicknames: false, can_manage_roles: false };
let currentFilter = '';
let page = 0;
const PAGE_SIZE = 20;
const RECENT_DAYS = 7;

function memberById(id) { return MEMBERS.find(m => String(m.id) === String(id)); }

function fmtDate(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  if (isNaN(d)) return '-';
  return d.toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
}
function isRecent(iso) {
  if (!iso) return false;
  const d = new Date(iso);
  if (isNaN(d)) return false;
  return (Date.now() - d.getTime()) < RECENT_DAYS * 86400000;
}
function memberTopRole(m) {
  let top = 0;
  (m.roles||[]).forEach(id => { const p = ROLE_POS[id]||0; if (p > top) top = p; });
  return top;
}
function canManageMember(m) { return BOT.bot_top_role_position > memberTopRole(m); }

function renderMembers() {
  const wrap = document.getElementById('members-table-wrap');
  const q = currentFilter.toLowerCase().trim();
  const rows = MEMBERS.filter(m => !q || (m.name||'').toLowerCase().includes(q) || (m.display_name||'').toLowerCase().includes(q));
  if (!rows.length) {
    wrap.innerHTML = '<div style="text-align:center;padding:2.5rem;color:rgba(255,255,255,0.25);font-size:0.8rem;">' + (q ? 'No members match your search.' : 'No members loaded.') + '</div>';
    return;
  }
  const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
  if (page >= totalPages) page = totalPages - 1;
  const start = page * PAGE_SIZE;
  const pageRows = rows.slice(start, start + PAGE_SIZE);
  wrap.innerHTML = `<table class="md-member-table" style="width:100%;border-collapse:separate;border-spacing:0 0.4rem;">
    <thead><tr>
      <th style="text-align:left;padding:0.3rem 0.5rem;font-size:0.68rem;color:rgba(255,255,255,0.3);">Member</th>
      <th style="text-align:left;padding:0.3rem 0.5rem;font-size:0.68rem;color:rgba(255,255,255,0.3);">Joined</th>
      <th style="text-align:left;padding:0.3rem 0.5rem;font-size:0.68rem;color:rgba(255,255,255,0.3);">Roles</th>
      <th style="text-align:left;padding:0.3rem 0.5rem;font-size:0.68rem;color:rgba(255,255,255,0.3);">Actions</th>
    </tr></thead><tbody>` +
    pageRows.map(m => {
      const avatarCls = (m.is_raider ? ' raider' : '') + (isRecent(m.joined_at) ? ' recent' : '');
      const manage = canManageMember(m);
      const mid = m.id;
      return `<tr>
      <td style="padding:0.6rem 0.5rem;background:rgba(255,255,255,0.02);border-top:1px solid rgba(255,255,255,0.06);border-bottom:1px solid rgba(255,255,255,0.06);border-left:1px solid rgba(255,255,255,0.06);border-radius:4px 0 0 4px;">
        <div class="md-member-info">
          <div class="md-member-avatar mem-avatar${avatarCls}"><img loading="lazy" decoding="async" src="${esc(m.avatar_url || ('https://cdn.discordapp.com/embed/avatars/'+(parseInt(m.id)%5)+'.png'))}" style="width:100%;height:100%;object-fit:cover;" /></div>
          <div>
            <div class="mem-name" style="font-weight:700;font-size:0.82rem;color:#e9edf5;padding-right:16px;">${esc(m.display_name || m.name)}${manage && BOT.can_manage_nicknames ? '<svg class="mem-edit" data-edit-nick="'+mid+'" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.4-9.4a2.1 2.1 0 113 3L11 17l-4 1 1-4 9.6-9.6z"/></svg>' : ''}</div>
            <div style="font-size:0.68rem;color:rgba(255,255,255,0.3);">@${esc(m.name)}</div>
          </div>
        </div>
      </td>
      <td style="padding:0.6rem 0.5rem;background:rgba(255,255,255,0.02);border-top:1px solid rgba(255,255,255,0.06);border-bottom:1px solid rgba(255,255,255,0.06);font-size:0.76rem;color:${isRecent(m.joined_at)?'#60a5fa':'rgba(255,255,255,0.5)'};white-space:nowrap;">${fmtDate(m.joined_at)}</td>
      <td style="padding:0.6rem 0.5rem;background:rgba(255,255,255,0.02);border-top:1px solid rgba(255,255,255,0.06);border-bottom:1px solid rgba(255,255,255,0.06);">
        <div class="mem-roles" data-roles-col style="display:flex;gap:0.25rem;flex-wrap:wrap;max-width:280px;align-items:center;min-height:20px;">
          ${(m.roles||[]).map(id => ROLE_MAP[id] ? `<span class="role-tag">${esc(ROLE_MAP[id])}${manage && BOT.can_manage_roles && !ROLE_MANAGED[id] ? '<span class="role-x" data-remove-role="'+id+'" data-mid="'+mid+'" data-tooltip="Remove role">✕</span>' : ''}</span>` : '').join('')}
          ${manage && BOT.can_manage_roles ? '<span class="role-tag" data-add-role="'+mid+'" style="cursor:pointer;color:rgba(255,255,255,0.35);font-weight:700;">+</span>' : ''}
        </div>
      </td>
      <td style="padding:0.6rem 0.5rem;background:rgba(255,255,255,0.02);border-top:1px solid rgba(255,255,255,0.06);border-bottom:1px solid rgba(255,255,255,0.06);border-right:1px solid rgba(255,255,255,0.06);border-radius:0 4px 4px 0;">
        <div class="md-actions-wrap"><button class="md-actions-btn" data-mid="${mid}"><i data-lucide="chevron-down"></i> Actions</button></div>
      </td>
    </tr>`;
    }).join('') + '</tbody></table>';

  // Pagination controls
  if (totalPages > 1) {
    const pag = document.createElement('div');
    pag.style.cssText = 'display:flex;align-items:center;justify-content:center;gap:0.5rem;margin-top:0.75rem;';
    const btn = (label, disabled, cb) => {
      const b = document.createElement('button');
      b.textContent = label;
      b.disabled = disabled;
      b.style.cssText = `padding:0.35rem 0.8rem;font-size:0.75rem;font-weight:700;font-family:'Lexend',system-ui,sans-serif;border-radius:4px;border:1px solid rgba(255,255,255,0.1);cursor:${disabled?'default':'pointer'};background:${disabled?'rgba(255,255,255,0.02)':'rgba(255,255,255,0.05)'};color:${disabled?'rgba(255,255,255,0.25)':'rgba(255,255,255,0.7)'};`;
      b.addEventListener('click', cb);
      pag.appendChild(b);
      return b;
    };
    btn('← Prev', page === 0, () => { page--; renderMembers(); });
    const info = document.createElement('span');
    info.textContent = (start + 1) + '–' + Math.min(start + PAGE_SIZE, rows.length) + ' of ' + rows.length;
    info.style.cssText = 'font-size:0.72rem;color:rgba(255,255,255,0.4);';
    pag.appendChild(info);
    btn('Next →', page >= totalPages - 1, () => { page++; renderMembers(); });
    wrap.appendChild(pag);
  }

  lucide.createIcons();
  bindEvents();
}

function bindEvents() {
  const overlay = document.getElementById('member-action-modal');
  document.querySelectorAll('.md-actions-btn').forEach(btn => btn.addEventListener('click', e => {
    e.stopPropagation();
    const m = memberById(btn.dataset.mid); if (!m) return;
    document.getElementById('modal-user-name').textContent = m.display_name || m.name;
    document.getElementById('modal-user-avatar').innerHTML = '<img src="' + esc(m.avatar_url || ('https://cdn.discordapp.com/embed/avatars/'+(parseInt(m.id)%5)+'.png')) + '" style="width:100%;height:100%;object-fit:cover;" />';
    document.getElementById('action-reason').value = '';
    overlay.classList.add('is-open'); overlay._member = m;
  }));

  document.querySelectorAll('[data-edit-nick]').forEach(icon => icon.addEventListener('click', e => {
    e.stopPropagation();
    const m = memberById(icon.dataset.editNick); if (!m) return;
    document.getElementById('nickname-user').textContent = (m.display_name || m.name) + ' @' + m.name;
    document.getElementById('nickname-input').value = m.display_name || '';
    document.getElementById('nickname-modal').classList.add('is-open');
    document.getElementById('nickname-modal')._member = m;
  }));

  document.querySelectorAll('[data-remove-role]').forEach(x => x.addEventListener('click', e => {
    e.stopPropagation();
    const m = memberById(x.dataset.mid); if (!m) return;
    queueAction({ action:'remove_role', user_id:m.id, user_name:m.name, target: x.dataset.removeRole });
  }));

  document.querySelectorAll('[data-add-role]').forEach(btn => btn.addEventListener('click', e => {
    e.stopPropagation();
    const m = memberById(btn.dataset.addRole); if (!m) return;
    openAddRole(m);
  }));
}

function openAddRole(m) {
  const list = document.getElementById('add-role-list');
  document.getElementById('add-role-user').textContent = m.display_name || m.name;
  const have = new Set(m.roles||[]);
  const options = Object.entries(ROLE_MAP).filter(([id]) => !have.has(id));
  list.innerHTML = options.length ? options.map(([id, name]) => `<button class="md-action-btn" data-add="${id}" style="justify-content:flex-start;">${esc(name)}</button>`).join('') : '<div style="text-align:center;padding:0.75rem;color:rgba(255,255,255,0.25);font-size:0.8rem;">No roles to add.</div>';
  list.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => {
    document.getElementById('add-role-modal').classList.remove('is-open');
    queueAction({ action:'add_role', user_id:m.id, user_name:m.name, target: b.dataset.add });
  }));
  document.getElementById('add-role-modal')._member = m;
  document.getElementById('add-role-modal').classList.add('is-open');
}

function queueAction(payload) {
  fetch(`/api/v1/mod/${GID}/action`, { method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ action: payload.action, user_id: payload.user_id, user_name: payload.user_name, reason: payload.reason||'', duration: payload.duration||null, target: payload.target||null }) })
    .then(r => r.json()).then(j => {
      if (typeof showToast==='function') showToast(j.direct ? 'Action completed.' : 'Queued for the bot.', j.direct ? 'success' : 'info');
      window.dispatchEvent(new CustomEvent('prowl:action-queued'));
      setTimeout(refreshMembers, 3000);
    })
    .catch(() => { if (typeof showToast==='function') showToast('Failed to queue.','error'); });
}

function sendAction(action, duration) {
  const overlay = document.getElementById('member-action-modal');
  const m = overlay._member; if (!m) return;
  const reason = document.getElementById('action-reason').value;
  overlay.classList.remove('is-open');
  queueAction({ action, user_id:m.id, user_name:m.name, reason, duration });
}

function refreshMembers() {
  return prowlCachedJson('members', 60000, `/api/v1/mod/${GID}/members`).then(d => {
    const next = d.members || [];
    // Cheap signature: ids + display names only (avoid stringifying all roles)
    let sig = '';
    for (let i = 0; i < next.length; i++) sig += next[i].id + ':' + (next[i].display_name || '') + ';';
    if (sig === lastSig) return;
    lastSig = sig;
    MEMBERS = next;
    renderMembers();
  }).catch(() => {});
}
let lastSig = '';

// Refresh every 30s, but pause entirely when the tab is hidden
(function memberLoop() {
  setTimeout(() => {
    if (!document.hidden) refreshMembers();
    memberLoop();
  }, document.hidden ? 60000 : 30000);
})();

document.addEventListener('DOMContentLoaded', () => {
  Promise.all([refreshMembers().then(() => MEMBERS), memApi('/roles'), memApi('/bot')]).then(([md, rd, bd]) => {
    (rd.roles||[]).filter(r => r.id !== GID && !r.managed).sort((a, b) => a.name.localeCompare(b.name)).forEach(r => { ROLE_MAP[r.id] = r.name; ROLE_POS[r.id] = r.position||0; ROLE_MANAGED[r.id] = !!r.managed; });
    BOT = { bot_top_role_position: bd.bot_top_role_position||0, can_manage_nicknames: !!bd.can_manage_nicknames, can_manage_roles: !!bd.can_manage_roles };
    renderMembers();
    // Debounced search
    let debounce;
    document.getElementById('member-search').addEventListener('input', e => {
      currentFilter = e.target.value;
      clearTimeout(debounce);
      debounce = setTimeout(() => { page = 0; renderMembers(); }, 200);
    });
  }).catch(() => document.getElementById('members-table-wrap').innerHTML = '<div style="text-align:center;padding:2.5rem;color:rgba(255,255,255,0.25);font-size:0.8rem;">Failed to load members.</div>');

  const overlay = document.getElementById('member-action-modal');
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('is-open'); });
  overlay.querySelector('.md-modal-close').addEventListener('click', () => overlay.classList.remove('is-open'));
  document.getElementById('action-reason').addEventListener('keydown', e => { if (e.key === 'Escape') overlay.classList.remove('is-open'); });
  overlay.querySelectorAll('[data-dur]').forEach(b => b.addEventListener('click', () => sendAction('mute', b.dataset.dur)));
  document.getElementById('modal-kick').addEventListener('click', () => sendAction('kick'));
  document.getElementById('modal-ban').addEventListener('click', () => sendAction('ban'));

  const addRoleModal = document.getElementById('add-role-modal');
  addRoleModal.addEventListener('click', e => { if (e.target === addRoleModal) addRoleModal.classList.remove('is-open'); });
  document.getElementById('add-role-cancel').addEventListener('click', () => addRoleModal.classList.remove('is-open'));

  const nickModal = document.getElementById('nickname-modal');
  nickModal.addEventListener('click', e => { if (e.target === nickModal) nickModal.classList.remove('is-open'); });
  document.getElementById('nickname-cancel').addEventListener('click', () => nickModal.classList.remove('is-open'));
  document.getElementById('nickname-save').addEventListener('click', () => {
    const m = nickModal._member; if (!m) return;
    const nick = document.getElementById('nickname-input').value;
    nickModal.classList.remove('is-open');
    queueAction({ action:'nickname', user_id:m.id, user_name:m.name, target:nick });
  });
  document.getElementById('nickname-input').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('nickname-save').click(); });
});
</script>
{% endblock %}
