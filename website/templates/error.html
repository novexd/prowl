<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prowl - {{ code }}</title>
  <meta name="description" content="prowl is your next discord bot! designed to do everything easily without any issues, its made to tackle every problem with ease. from moderation and ai to music, leveling, and a full web dashboard" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Prowl — The All-in-One Discord Bot" />
  <meta property="og:description" content="The cat Discord bot that does literally everything with one click. Easy to setup, easy to use." />
  <meta property="og:url" content="https://prowlbot.xyz/" />
  <meta property="og:image" content="https://prowlbot.xyz/static/preview.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" href="/static/favicon.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: 'Lexend', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      overflow: hidden;
    }
    .code {
      font-size: clamp(6rem, 20vw, 16rem);
      font-weight: 900;
      letter-spacing: -0.05em;
      line-height: 0.85;
      color: rgba(255,255,255,0.04);
      user-select: none;
      position: fixed;
      z-index: 0;
      pointer-events: none;
    }
    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
      color: #fff;
      margin-bottom: 0.5rem;
    }
    .brand img { width: 26px; height: 26px; }
    .brand span {
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
    }
    h1 {
      font-size: clamp(1.5rem, 3vw, 2.5rem);
      font-weight: 900;
      letter-spacing: -0.03em;
    }
    p {
      font-size: 0.9rem;
      color: #666;
      font-weight: 500;
      max-width: 380px;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.75rem 1.75rem;
      background: #fff;
      color: #0a0a0a;
      font-weight: 700;
      font-size: 0.85rem;
      text-decoration: none;
      border-radius: 4px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .retry-hint { color: #888; }
    .retry-hint strong { color: #fff; font-weight: 700; }
    .wave-field {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .wave-field span {
      position: absolute;
      color: #fff;
      font-family: monospace;
      user-select: none;
      line-height: 1;
    }
    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 30%, #0a0a0a 80%);
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body>
  <div class="code">{{ code }}</div>
  <div class="wave-field" id="wave-field"></div>
  <div class="vignette"></div>
  <div class="content">
    <a href="/" class="brand">
      <img src="/static/favicon.png" alt="Prowl" />
      <span>Prowl</span>
    </a>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    {% if retry_in is defined %}
      <p class="retry-hint">You're being rate limited. Retrying in <strong id="retry-count">{{ retry_in }}</strong>s...</p>
    {% endif %}
    <a href="/" class="btn">Go Home</a>
  </div>
  <script>
    const waveField = document.getElementById('wave-field');
    const count = window.innerWidth < 768 ? 25 : 50;
    for (let i = 0; i < count; i++) {
      const el = document.createElement('span');
      el.textContent = '~';
      el.style.left = Math.random() * 100 + '%';
      el.style.top = Math.random() * 100 + '%';
      el.style.fontSize = (1 + Math.random() * 1.8) + 'rem';
      el.style.opacity = 0.03 + Math.random() * 0.08;
      waveField.appendChild(el);
    }
    // ── 429 countdown + auto retry ──
    const retryCount = document.getElementById('retry-count');
    if (retryCount) {
      let secs = parseInt(retryCount.textContent) || 30;
      const tick = setInterval(() => {
        secs -= 1;
        if (secs <= 0) { clearInterval(tick); location.reload(); return; }
        retryCount.textContent = secs;
      }, 1000);
    }
  </script>
</body>
</html>
