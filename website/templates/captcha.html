<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prowl - Verification</title>
  <meta name="description" content="Solve the verification captcha to get verified automatically." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Prowl — The All-in-One Discord Bot" />
  <meta property="og:description" content="The cat Discord bot that does literally everything with one click. Easy to setup, easy to use." />
  <meta property="og:url" content="https://prowlbot.xyz/" />
  <meta property="og:image" content="https://prowlbot.xyz/static/preview.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Prowl — The All-in-One Discord Bot" />
  <meta name="twitter:description" content="The cat Discord bot that does literally everything with one click. Easy to setup, easy to use." />
  <meta name="twitter:image" content="https://prowlbot.xyz/static/preview.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" href="/static/favicon.png" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <link rel="stylesheet" href="/static/landing.css?v=3" />
  <style>
    .captcha-page {
      min-height: 100vh; width: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      padding: 0 6vw; position: relative; z-index: 1;
    }
    .captcha-brand { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; color: #fff; margin-bottom: 2rem; }
    .captcha-brand img { width: 32px; height: 32px; object-fit: contain; }
    .captcha-brand span { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.02em; }
    .captcha-card {
      width: 100%; max-width: 420px; border: 1px solid rgba(255,255,255,0.12);
      background: #151515; border-radius: 6px; padding: 1.75rem;
    }
    .captcha-title { font-size: 1.15rem; font-weight: 800; letter-spacing: -0.01em; }
    .captcha-sub { margin-top: 0.6rem; font-size: 0.85rem; color: #666; font-weight: 500; line-height: 1.6; }
    .captcha-widget { display: flex; justify-content: center; margin: 1.4rem 0 1.1rem; min-height: 82px; }
    .captcha-status { font-size: 0.85rem; font-weight: 600; min-height: 1.4em; margin-top: 0.4rem; }
    .captcha-status.ok { color: #34d399; }
    .captcha-status.err { color: #f87171; }
    .captcha-spinner {
      width: 14px; height: 14px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.15); border-top-color: #fff;
      animation: cap-spin 0.8s linear infinite; display: inline-block;
      vertical-align: middle; margin-right: 0.4rem;
    }
    @keyframes cap-spin { to { transform: rotate(360deg); } }
    .captcha-back { display: inline-block; margin-top: 1.25rem; font-size: 0.8rem; color: #555; text-decoration: none; font-weight: 600; transition: color 0.2s; }
    .captcha-back:hover { color: #888; }
  </style>
</head>
<body>

  <div class="wave-field" id="wave-field"></div>
  <div class="vignette"></div>

  <div class="captcha-page">
    <a href="/" class="captcha-brand gsap-hero">
      <img src="/static/favicon.png" alt="Prowl" />
      <span>Prowl</span>
    </a>
    <div class="captcha-card gsap-hero">
      <h1 class="captcha-title">Google reCAPTCHA</h1>
      <p class="captcha-sub">Complete the puzzle below. You'll be verified automatically - no need to copy anything.</p>
      <div class="captcha-widget">
        {% if recaptcha_version == "v3" %}
          <div style="display:flex;align-items:center;gap:0.5rem;font-size:0.8rem;color:rgba(255,255,255,0.5);">
            <span class="captcha-spinner"></span> Checking you're human...
          </div>
        {% else %}
          <div class="g-recaptcha" data-sitekey="{{ site_key }}" data-theme="dark"></div>
        {% endif %}
      </div>
      <div class="captcha-status" id="status"></div>
    </div>
    <a href="/" class="captcha-back gsap-btns">Back to home</a>
  </div>

  {% if recaptcha_version == "v3" %}
  <script src="https://www.google.com/recaptcha/api.js?render={{ site_key }}" async defer></script>
  {% else %}
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  {% endif %}
  <script>
    const CODE = {{ code | tojson }};
    const PROVIDER = {{ provider | tojson }};
    const statusEl = document.getElementById('status');
    let done = false;

    function setStatus(text, ok) {
      if (!text) { statusEl.textContent = ''; statusEl.className = 'captcha-status'; return; }
      statusEl.textContent = text;
      statusEl.className = 'captcha-status ' + (ok ? 'ok' : 'err');
    }

    async function complete(token) {
      if (done) return;
      done = true;
      setStatus('Verifying...');
      try {
        const res = await fetch('/api/v1/captcha/complete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, code: CODE, provider: PROVIDER })
        });
        if (res.status === 500) {
          setStatus('Internal server error - please try again later.', false);
          return;
        }
        const data = await res.json();
        if (res.ok && data.ok) {
          setStatus('✅ Verified! You can close this page.', true);
        } else {
          const msg = (data && data.error) ? data.error : 'Verification failed. Please try again.';
          setStatus(msg, false);
        }
      } catch (e) {
        setStatus('Network error - please try again later.', false);
      }
    }

    // ── Tildes ──
    const waveField = document.getElementById('wave-field');
    const isMobile = window.innerWidth < 768;
    const tildeCount = isMobile ? 20 : 36;
    for (let i = 0; i < tildeCount; i++) {
      const el = document.createElement('span');
      el.textContent = '~';
      el.style.left = Math.random() * 100 + '%';
      el.style.top = Math.random() * 100 + '%';
      el.style.fontSize = (1 + Math.random() * 1.8) + 'rem';
      el.style.opacity = 0.04 + Math.random() * 0.1;
      el.style.setProperty('--dx', (-12 + Math.random() * 24) + 'px');
      el.style.setProperty('--dy', (-20 + Math.random() * 40) + 'px');
      el.style.animation = `tildeFloat ${4 + Math.random() * 6}s ease-in-out ${Math.random() * 4}s infinite alternate`;
      waveField.appendChild(el);
    }

    // ── Load animation ──
    gsap.set('.gsap-hero', { opacity: 0, y: 30 });
    gsap.set('.gsap-btns', { opacity: 0, y: 24 });
    const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });
    tl.to('.gsap-hero', { opacity: 1, y: 0, duration: 0.7 })
      .to('.gsap-btns', { opacity: 1, y: 0, duration: 0.6 }, '-=0.35');

    {% if recaptcha_version == "v3" %}
      window.onload = function() {
        if (window.grecaptcha) {
          grecaptcha.ready(function() {
            grecaptcha.execute({{ site_key | tojson }}, { action: 'verify' }).then(function(token) {
              if (token) complete(token);
              else setStatus('Could not obtain a token - the site key may be wrong.', false);
            }).catch(function() {
              setStatus('Invalid reCAPTCHA key - the site key does not match the version. Try a v2 checkbox key or set RECAPTCHA_VERSION=v2.', false);
            });
          });
        } else {
          setStatus('reCAPTCHA did not load. Check your site key.', false);
        }
      };
    {% elif provider == "recaptcha" %}
      window.onload = function() {
        if (window.grecaptcha) {
          try {
            grecaptcha.render(document.querySelector('.g-recaptcha'), {
              sitekey: {{ site_key | tojson }},
              theme: 'dark',
              callback: complete,
              'expired-callback': function() { done = false; setStatus('Captcha expired - solve it again.', false); },
              'error-callback': function() { done = false; setStatus('Captcha error - try again.', false); }
            });
          } catch (e) {
            setStatus('Captcha setup issue - site key type mismatch.', false);
          }
        }
      };
    {% endif %}
  </script>
</body>
</html>
