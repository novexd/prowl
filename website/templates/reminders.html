<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prowl - Reminders</title>
  <meta name="description" content="Set personal reminders and manage your to-do list with Prowl. Reminders are delivered via DM." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Prowl Reminders" />
  <meta property="og:description" content="Set personal reminders and manage your to-do list with Prowl." />
  <meta property="og:url" content="https://prowlbot.xyz/reminders" />
  <meta property="og:image" content="https://prowlbot.xyz/static/preview.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" href="/static/favicon.png" />
  <script src="/static/lucide.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Lexend',system-ui,sans-serif; background:#0a0a0b; color:#e9edf5; min-height:100vh; }
    a { color:inherit; text-decoration:none; }

    .topbar { display:flex; align-items:center; justify-content:space-between; padding:0.9rem 1.5rem; border-bottom:1px solid rgba(255,255,255,0.06); background:rgba(255,255,255,0.02); }
    .topbar-brand { display:flex; align-items:center; gap:0.5rem; font-weight:800; font-size:1rem; letter-spacing:-0.02em; }
    .topbar-brand img { width:22px; height:22px; object-fit:contain; }
    .topbar-right { display:flex; align-items:center; gap:1rem; }
    .topbar-user { display:flex; align-items:center; gap:0.5rem; font-size:0.8rem; font-weight:600; color:rgba(255,255,255,0.6); }
    .topbar-user img { width:24px; height:24px; border-radius:50%; }
    .topbar-logout { font-size:0.75rem; font-weight:600; color:rgba(255,255,255,0.35); padding:0.35rem 0.7rem; border:1px solid rgba(255,255,255,0.08); border-radius:4px; cursor:pointer; background:none; transition:color 0.15s, border-color 0.15s; }
    .topbar-logout:hover { color:#f87171; border-color:rgba(248,113,113,0.4); }

    .wrap { max-width:920px; margin:0 auto; padding:2rem 1.5rem 3rem; }
    .page-title { font-size:26px; font-weight:900; letter-spacing:-0.03em; line-height:1.05; margin-bottom:0.3rem; }
    .page-sub { color:rgba(255,255,255,0.5); font-size:14px; font-weight:600; margin-bottom:1.5rem; }

    .grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; align-items:start; }
    @media (max-width:760px){ .grid { grid-template-columns:1fr; } }

    .card { border:1px solid rgba(255,255,255,0.08); border-radius:6px; background:rgba(255,255,255,0.015); padding:1.1rem; }
    .card-title { font-size:0.9rem; font-weight:800; letter-spacing:-0.01em; margin-bottom:0.35rem; }
    .card-hint { font-size:0.72rem; color:rgba(255,255,255,0.35); line-height:1.5; margin-bottom:0.85rem; }
    .card-hint code { background:rgba(255,255,255,0.06); padding:0.1rem 0.35rem; border-radius:3px; font-size:0.7rem; }

    .add-row { display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap; }
    .add-row input { background:#1a1a1a; border:1px solid rgba(255,255,255,0.08); border-radius:4px; color:#e9edf5; font-family:'Lexend',system-ui,sans-serif; font-size:0.82rem; font-weight:600; padding:0.5rem 0.7rem; flex:1; min-width:120px; outline:none; transition:border-color 0.15s; }
    .add-row input:focus { border-color:rgba(255,255,255,0.2); }
    #rem-when { flex:0 0 130px; min-width:110px; }
    .add-btn { display:flex; align-items:center; gap:0.35rem; background:rgba(88,101,242,0.15); border:1px solid rgba(88,101,242,0.4); color:#c7cdff; font-family:'Lexend',system-ui,sans-serif; font-size:0.82rem; font-weight:600; padding:0.5rem 0.9rem; border-radius:4px; cursor:pointer; outline:none; transition:background 0.15s; white-space:nowrap; }
    .add-btn:hover { background:rgba(88,101,242,0.28); }

    .list { margin-top:0.85rem; display:flex; flex-direction:column; gap:0.4rem; }
    .empty { text-align:center; padding:1rem; color:rgba(255,255,255,0.25); font-size:0.8rem; }
    .row { display:flex; align-items:center; gap:0.6rem; padding:0.5rem 0.6rem; border:1px solid rgba(255,255,255,0.06); border-radius:4px; background:rgba(255,255,255,0.01); }
    .row .badge { font-size:0.68rem; font-weight:800; letter-spacing:0.03em; color:#c7cdff; background:rgba(88,101,242,0.12); border:1px solid rgba(88,101,242,0.3); border-radius:4px; padding:0.2rem 0.5rem; white-space:nowrap; }
    .row .msg { flex:1; font-size:0.82rem; font-weight:600; color:#e9edf5; word-break:break-word; }
    .row .action { margin-left:auto; background:none; border:none; color:rgba(255,255,255,0.35); cursor:pointer; padding:0.35rem; border-radius:4px; display:flex; }
    .row .action:hover { color:#f87171; background:rgba(248,113,113,0.08); }
    .row.todo .action { color:rgba(255,255,255,0.35); }
    .row.todo .action:hover { color:#34d399; background:rgba(52,211,153,0.08); }
    .row.todo.done { opacity:0.55; }
    .row.todo.done .msg { text-decoration:line-through; }
    .check { display:flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:4px; border:1.5px solid rgba(255,255,255,0.25); color:transparent; flex:0 0 auto; }
    .row.todo.done .check { background:rgba(52,211,153,0.2); border-color:#34d399; color:#34d399; }
    .clear-btn { background:none; border:1px solid rgba(255,255,255,0.1); color:rgba(255,255,255,0.4); font-family:'Lexend',system-ui,sans-serif; font-size:0.7rem; font-weight:600; padding:0.3rem 0.55rem; border-radius:4px; cursor:pointer; }
    .clear-btn:hover { color:#f87171; border-color:rgba(248,113,113,0.4); }

    .toast { position:fixed; bottom:1.5rem; right:1.5rem; padding:0.65rem 1rem; border-radius:6px; font-size:0.8rem; font-weight:600; z-index:9999; transform:translateY(20px); opacity:0; transition:transform 0.25s, opacity 0.25s; pointer-events:none; }
    .toast.show { transform:translateY(0); opacity:1; }
    .toast.success { background:rgba(52,211,153,0.15); border:1px solid rgba(52,211,153,0.35); color:#34d399; }
    .toast.error { background:rgba(248,113,113,0.15); border:1px solid rgba(248,113,113,0.35); color:#f87171; }
  </style>
</head>
<body>

  <div class="topbar">
    <a href="/" class="topbar-brand">
      <img src="/static/favicon.png" alt="Prowl" />
      <span>Prowl</span>
    </a>
    <div class="topbar-right">
      <div class="topbar-user">
        <img src="{{ user.get('avatar', '') }}" alt="" referrerpolicy="no-referrer" />
        <span>{{ user.get('username', '') }}</span>
      </div>
      <a href="/dashboard" class="topbar-logout">Dashboard</a>
      <a href="/logout" class="topbar-logout">Log out</a>
    </div>
  </div>

  <div class="wrap">
    <div class="page-title">Reminders &amp; To-Do</div>
    <div class="page-sub">Set personal reminders and keep a to-do list &mdash; delivered by Prowl via DM.</div>

    <div class="grid">
      <!-- Reminders -->
      <div class="card">
        <div class="card-title">Reminders</div>
        <div class="card-hint">
          Prowl DMs you at the time you pick. Try <code>30m</code>, <code>2h</code>, <code>tomorrow 9am</code>, <code>fri 18:00</code>.
        </div>
        <div class="add-row">
          <input type="text" id="rem-when" maxlength="40" placeholder="when (e.g. 2h)" spellcheck="false" />
          <input type="text" id="rem-what" maxlength="900" placeholder="what should I remind you?" spellcheck="false" />
          <button type="button" class="add-btn" id="rem-add"><i data-lucide="plus"></i> Add</button>
        </div>
        <div id="rem-list" class="list"><div class="empty">Loading...</div></div>
      </div>

      <!-- To-Do -->
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.35rem;">
          <div class="card-title">To-Do List</div>
          <button type="button" class="clear-btn" id="todo-clear-done">Clear done</button>
        </div>
        <div class="card-hint">A private checklist just for you.</div>
        <div class="add-row">
          <input type="text" id="todo-task" maxlength="900" placeholder="add a task..." spellcheck="false" />
          <button type="button" class="add-btn" id="todo-add"><i data-lucide="plus"></i> Add</button>
        </div>
        <div id="todo-list" class="list"><div class="empty">Loading...</div></div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

<script>
const esc = s => { const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; };

function showToast(msg, type, dur) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || 'success');
  requestAnimationFrame(() => t.classList.add('show'));
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), dur || 3000);
}

async function loadAll() {
  try {
    const res = await fetch('/api/v1/user/reminders');
    const data = await res.json();
    renderReminders(data.reminders || []);
    renderTodos(data.todos || []);
  } catch (e) {
    document.getElementById('rem-list').innerHTML = '<div class="empty">Failed to load.</div>';
    document.getElementById('todo-list').innerHTML = '<div class="empty">Failed to load.</div>';
  }
}

function renderReminders(items) {
  const el = document.getElementById('rem-list');
  if (!items.length) { el.innerHTML = '<div class="empty">No reminders yet.</div>'; return; }
  el.innerHTML = items.map(r => `
    <div class="row" data-id="${r.id}">
      <span class="badge">${esc(r.when)}</span>
      <span class="msg">${esc(r.message)}</span>
      <button class="action" data-remove="${r.id}" title="Cancel reminder"><i data-lucide="x"></i></button>
    </div>`).join('');
  el.querySelectorAll('[data-remove]').forEach(b => b.addEventListener('click', () => removeReminder(b.dataset.remove)));
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

function renderTodos(items) {
  const el = document.getElementById('todo-list');
  if (!items.length) { el.innerHTML = '<div class="empty">Nothing here yet.</div>'; return; }
  el.innerHTML = items.map(t => `
    <div class="row todo ${t.done ? 'done' : ''}" data-id="${t.id}">
      <button class="action" data-done="${t.id}" title="Mark done"><span class="check"><i data-lucide="check"></i></span></button>
      <span class="msg">${esc(t.task)}</span>
    </div>`).join('');
  el.querySelectorAll('[data-done]').forEach(b => b.addEventListener('click', () => completeTodo(b.dataset.done)));
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

async function addReminder() {
  const when = document.getElementById('rem-when').value.trim();
  const what = document.getElementById('rem-what').value.trim();
  if (!what) { showToast('Add a message for your reminder.', 'error', 4000); return; }
  const btn = document.getElementById('rem-add');
  btn.disabled = true;
  try {
    const res = await fetch('/api/v1/user/reminders', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ when, what })
    });
    const data = await res.json().catch(()=>({}));
    if (!res.ok) { showToast(data.error || 'Could not add reminder.', 'error', 5000); }
    else {
      document.getElementById('rem-when').value = '';
      document.getElementById('rem-what').value = '';
      showToast('Reminder set!', 'success');
      await loadAll();
    }
  } catch (e) {
    showToast('Network error.', 'error', 4000);
  } finally { btn.disabled = false; }
}

async function removeReminder(id) {
  try {
    await fetch(`/api/v1/user/reminders/${id}`, { method: 'DELETE' });
    await loadAll();
  } catch (e) {}
}

async function addTodo() {
  const task = document.getElementById('todo-task').value.trim();
  if (!task) { showToast('Add a task first.', 'error', 4000); return; }
  const btn = document.getElementById('todo-add');
  btn.disabled = true;
  try {
    const res = await fetch('/api/v1/user/todos', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ task })
    });
    const data = await res.json().catch(()=>({}));
    if (!res.ok) { showToast(data.error || 'Could not add task.', 'error', 5000); }
    else {
      document.getElementById('todo-task').value = '';
      showToast('Added to your list.', 'success');
      await loadAll();
    }
  } catch (e) {
    showToast('Network error.', 'error', 4000);
  } finally { btn.disabled = false; }
}

async function completeTodo(id) {
  try {
    await fetch(`/api/v1/user/todos/${id}/done`, { method: 'POST' });
    await loadAll();
  } catch (e) {}
}

async function clearDone() {
  try {
    await fetch('/api/v1/user/todos?done_only=1', { method: 'DELETE' });
    await loadAll();
  } catch (e) {}
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('rem-add').addEventListener('click', addReminder);
  document.getElementById('todo-add').addEventListener('click', addTodo);
  document.getElementById('todo-clear-done').addEventListener('click', clearDone);
  document.getElementById('rem-what').addEventListener('keydown', e => { if (e.key === 'Enter') addReminder(); });
  document.getElementById('todo-task').addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });
  if (typeof lucide !== 'undefined') lucide.createIcons();
  loadAll();
});
</script>
</body>
</html>
